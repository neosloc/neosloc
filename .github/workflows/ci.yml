name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is the floor for the dependency-free core; the anthropic SDK
        # (and its contract test) needs 3.10+.
        python: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # stability and value read git history
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Unit tests
        run: |
          extra=""
          if [ "${{ matrix.python }}" != "3.8" ]; then extra="--with anthropic"; fi
          uv run --no-project --python ${{ matrix.python }} $extra --with jsonschema --with coverage \
            python -m coverage run --source=neosloc -m unittest discover -v -s tests -t .
      - name: Coverage floor
        if: matrix.python == '3.12'
        run: uv run --no-project --python 3.12 --with coverage python -m coverage report --fail-under=90
      - name: Assess this repository
        run: uv run --no-project --python ${{ matrix.python }} python -m neosloc .

  package:
    name: build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel and run the `neosloc` command
        run: |
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv/bin/python dist/*.whl
          /tmp/venv/bin/neosloc --version
          /tmp/venv/bin/neosloc --json . > /tmp/report.json
          /tmp/venv/bin/neosloc --schema > /tmp/schema.json
          uv run --no-project --python 3.12 --with jsonschema python -c "
          import json, jsonschema
          jsonschema.Draft202012Validator(json.load(open('/tmp/schema.json'))).validate(json.load(open('/tmp/report.json')))
          print('report validates against neosloc --schema')"
          set +e; /tmp/venv/bin/neosloc --json /nonexistent > /tmp/error.json; status=$?; set -e
          test "$status" = 3
          python3 -c "import json; assert json.load(open('/tmp/error.json'))['error']['code'] == 'not_a_directory'"

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run --no-project --python 3.12 --with-requirements docs/requirements.txt mkdocs build --strict
