[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neosloc"
dynamic = ["version"]
description = "Integrability evaluation for software repositories: what sloccount measured, re-asked for the age of LLMs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Marco Montanari" }]
keywords = ["sloccount", "cocomo", "integrability", "software metrics", "llm", "agents", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Anthropic models only. OpenRouter models and the static analysis need nothing;
# the core stays dependency-free on Python 3.8.
agentic = ["anthropic>=1.11; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/sirmmo/neosloc"
Documentation = "https://ingmmo.com/neosloc/"
Repository = "https://github.com/sirmmo/neosloc"
Issues = "https://github.com/sirmmo/neosloc/issues"
Changelog = "https://github.com/sirmmo/neosloc/blob/main/CHANGELOG.md"

[project.scripts]
neosloc = "neosloc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "neosloc.__version__" }

[tool.setuptools.packages.find]
include = ["neosloc*"]
